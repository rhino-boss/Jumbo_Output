<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="alternate icon" href="assets/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<meta name="theme-color" content="#2a3d5c">
<link rel="stylesheet" href="assets/style.css">
<title>Omniplay</title>
</head>
<body>

<div class="hero">
  <div class="hero-in">
    <img class="logo" src="assets/favicon.svg" alt="" width="44" height="44">
    <div>
      <h1>Omniplay</h1>
      <p>歡迎提供建議</p>
    </div>
  </div>
</div>

<div class="container">
  <input id="q" type="search" placeholder="搜尋遊戲名稱、代號、玩法、廠商、報告…" autocomplete="off">

  <!-- ── Demogame ── -->
  <div class="section demo" id="sec-demo">
    <div class="sec-head">
      <h2>Demogame</h2>
      <span class="n" id="n-demo">–</span>
      <div class="sec-actions">
        <button class="sec-btn" id="demo-view" type="button" title="切換卡片／清單">☰ 清單</button>
        <a class="sec-btn" href="games.html">全部顯示 →</a>
      </div>
    </div>
    <div id="demo-body"></div>
  </div>

  <!-- ── 分析報告 ── -->
  <div class="section analysis" id="sec-analysis">
    <div class="sec-head">
      <h2>分析報告</h2>
      <span class="n" id="n-analysis">–</span>
    </div>
    <div class="grid" id="analysis-body"></div>
  </div>

  <!-- ── 其他報告 ── -->
  <div class="section report" id="sec-report">
    <div class="sec-head">
      <h2>其他報告</h2>
      <span class="n" id="n-report">–</span>
    </div>
    <div class="grid" id="report-body"></div>
  </div>

  <!-- ── 常用連結 ── -->
  <div class="section links" id="sec-links">
    <div class="sec-head">
      <h2>常用連結</h2>
      <span class="n" id="n-links">–</span>
    </div>
    <div class="grid" id="links-body"></div>
  </div>
</div>

<footer>made with ☕ by c</footer>

<script src="catalog.js"></script>
<script src="assets/app.js"></script>
<script>
(function () {
  var RAIL_MAX = 3;                       // 橫排一次看幾張，其餘左右滑動
  var VIEW_KEY = "omniplay-demo-view";    // "rail" | "list"

  var qEl = document.getElementById("q");
  var viewBtn = document.getElementById("demo-view");
  var manual = (window.CATALOG || []).slice();

  var games = [];
  var analysis = [];
  var loading = { demo: true, analysis: true };
  var demoView = (function () {
    try { return localStorage.getItem(VIEW_KEY) === "list" ? "list" : "rail"; }
    catch (e) { return "rail"; }
  })();

  function byDateDesc(a, b) {
    return String(b.date || "").localeCompare(String(a.date || "")) ||
           String(a.title || "").localeCompare(String(b.title || ""));
  }
  function manualOf(cat) {
    return manual.filter(function (i) { return i.cat === cat; }).sort(byDateDesc);
  }
  function matches(o, q) { return !q || Omni.haystackOf(o).indexOf(q) !== -1; }

  function setCount(id, n) { document.getElementById("n-" + id).textContent = n; }

  function emptyBox(msg) { return '<div class="sec-empty">' + Omni.esc(msg) + '</div>'; }

  /* ---------- Demogame 區 ---------- */
  function renderDemo(q) {
    var body = document.getElementById("demo-body");
    var list = games.filter(function (g) { return matches(g, q); });
    setCount("demo", loading.demo ? "…" : list.length);

    viewBtn.textContent = demoView === "list" ? "▦ 卡片" : "☰ 清單";
    viewBtn.title = demoView === "list" ? "點一下切換成卡片" : "點一下切換成清單";

    if (loading.demo && !games.length) { body.innerHTML = emptyBox("正在載入 Demogame…"); return; }
    if (!list.length) { body.innerHTML = emptyBox(q ? "沒有符合的遊戲。" : "掃不到任何遊戲。"); return; }

    // NEW 緞帶：更新時間最新的前 3 款
    var newest = {};
    list.slice(0, 3).forEach(function (g) { if (g.updated) newest[g.folder] = true; });

    if (demoView === "list") {
      body.className = "grid";
      body.innerHTML = list.map(function (g) { return Omni.listCard(Omni.gameAsItem(g)); }).join("");
    } else {
      body.className = "rail";
      body.innerHTML = list.map(function (g) { return Omni.gameCard(g, !!newest[g.folder]); }).join("");
    }
  }

  viewBtn.addEventListener("click", function () {
    demoView = demoView === "list" ? "rail" : "list";
    try { localStorage.setItem(VIEW_KEY, demoView); } catch (e) {}
    renderDemo(qEl.value.trim().toLowerCase());
  });

  /* ---------- 其餘三區（都是圖4 那種卡） ---------- */
  function renderCards(id, items, q, emptyMsg) {
    var body = document.getElementById(id + "-body");
    var list = items.filter(function (i) { return matches(i, q); });
    setCount(id, loading[id] ? "…" : list.length);
    if (loading[id] && !items.length) { body.innerHTML = emptyBox("正在載入…"); return; }
    if (!list.length) { body.innerHTML = emptyBox(q ? "沒有符合的項目。" : emptyMsg); return; }
    body.innerHTML = list.map(Omni.listCard).join("");
  }

  function renderAll() {
    var q = qEl.value.trim().toLowerCase();
    renderDemo(q);
    renderCards("analysis", analysis.slice().sort(byDateDesc), q, "掃不到任何分析報告。");
    renderCards("report", manualOf("report"), q, "還沒有其他報告 — 在 catalog.js 加入 cat: \"report\" 的項目。");
    renderCards("links", manualOf("links"), q, "常用連結待補 — 在 catalog.js 加入 cat: \"links\" 的項目。");
  }

  qEl.addEventListener("input", renderAll);
  renderAll();

  Omni.loadGames().then(function (g) { games = g; loading.demo = false; renderAll(); });
  Omni.loadAnalysis().then(function (a) { analysis = a; loading.analysis = false; renderAll(); });
})();
</script>
</body>
</html>
