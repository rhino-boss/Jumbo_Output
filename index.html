<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="alternate icon" href="assets/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<meta name="theme-color" content="#2a3d5c">
<link rel="stylesheet" href="assets/style.css">
<title>Omniplay</title>
</head>
<body>

<div class="hero">
  <div class="hero-in">
    <img class="logo" src="assets/favicon.svg" alt="" width="44" height="44">
    <div>
      <h1>Omniplay</h1>
      <p>歡迎提供建議</p>
    </div>
  </div>
</div>

<div class="container">
  <div class="status-bar" id="status">
    <div class="dot"></div>
    <span id="status-text">正在載入…</span>
  </div>

  <div class="stats">
    <div class="stat-card demo">
      <div class="stat-num"><span id="s-demo">0</span><span class="unit">款</span></div>
      <div class="stat-label">Demogame</div>
    </div>
    <div class="stat-card analysis">
      <div class="stat-num"><span id="s-analysis">0</span><span class="unit">份</span></div>
      <div class="stat-label">分析報告</div>
    </div>
    <div class="stat-card report">
      <div class="stat-num"><span id="s-report">0</span><span class="unit">份</span></div>
      <div class="stat-label">其他報告</div>
    </div>
    <div class="stat-card links">
      <div class="stat-num"><span id="s-links">0</span><span class="unit">個</span></div>
      <div class="stat-label">常用連結</div>
    </div>
  </div>

  <input id="q" type="search" placeholder="搜尋遊戲名稱、代號、玩法、廠商、報告…" autocomplete="off">
  <div class="notes" id="notes" hidden></div>

  <!-- ── Demogame ── -->
  <div class="section demo" id="sec-demo">
    <div class="sec-head">
      <span class="cdot"></span>
      <h2>Demogame</h2>
      <span class="n" id="n-demo"></span>
      <div class="sec-actions">
        <button class="sec-btn" id="demo-view" type="button" title="切換卡片／清單">☰ 清單</button>
        <a class="sec-link" href="games.html">查看全部 →</a>
      </div>
    </div>
    <div id="demo-body"></div>
  </div>

  <!-- ── 分析報告 ── -->
  <div class="section analysis" id="sec-analysis">
    <div class="sec-head">
      <span class="cdot"></span>
      <h2>分析報告</h2>
      <span class="n" id="n-analysis"></span>
    </div>
    <div class="grid" id="analysis-body"></div>
  </div>

  <!-- ── 其他報告 ── -->
  <div class="section report" id="sec-report">
    <div class="sec-head">
      <span class="cdot"></span>
      <h2>其他報告</h2>
      <span class="n" id="n-report"></span>
    </div>
    <div class="grid" id="report-body"></div>
  </div>

  <!-- ── 常用連結 ── -->
  <div class="section links" id="sec-links">
    <div class="sec-head">
      <span class="cdot"></span>
      <h2>常用連結</h2>
      <span class="n" id="n-links"></span>
    </div>
    <div class="link-grid" id="links-body"></div>
  </div>
</div>

<footer>made with ☕ by c</footer>

<script src="catalog.js"></script>
<script src="assets/app.js"></script>
<script>
(function () {
  var VIEW_KEY = "omniplay-demo-view";    // "rail" | "list"

  var qEl = document.getElementById("q");
  var viewBtn = document.getElementById("demo-view");
  var manual = (window.CATALOG || []).slice();

  var games = [];
  var analysis = [];
  var loading = { demo: true, analysis: true };
  var demoView = (function () {
    try { return localStorage.getItem(VIEW_KEY) === "list" ? "list" : "rail"; }
    catch (e) { return "rail"; }
  })();

  // 有日期的排前面（新到舊）；沒日期的維持 catalog.js 裡的順序（sort 是穩定的）
  function manualOf(cat) {
    return manual.filter(function (i) { return i.cat === cat; }).sort(function (a, b) {
      if (!a.date && !b.date) return 0;
      if (!a.date) return 1;
      if (!b.date) return -1;
      return String(b.date).localeCompare(String(a.date));
    });
  }
  function byDateDesc(a, b) {
    return String(b.date || "").localeCompare(String(a.date || "")) ||
           String(a.title || "").localeCompare(String(b.title || ""));
  }
  function matches(o, q) { return !q || Omni.haystackOf(o).indexOf(q) !== -1; }
  function emptyBox(msg) { return '<div class="sec-empty">' + Omni.esc(msg) + '</div>'; }

  /* ---------- 狀態列、統計方塊、提示 ---------- */
  function renderTop() {
    var reports = manualOf("report"), links = manualOf("links");
    document.getElementById("s-demo").textContent = games.length;
    document.getElementById("s-analysis").textContent = analysis.length;
    document.getElementById("s-report").textContent = reports.length;
    document.getElementById("s-links").textContent = links.length;

    var bar = document.getElementById("status");
    var txt = document.getElementById("status-text");
    var busy = loading.demo || loading.analysis;
    bar.className = "status-bar" + (Omni.notes.length ? " warn" : "");
    txt.textContent = busy
      ? "正在載入…"
      : "共 " + (games.length + analysis.length + reports.length + links.length) +
        " 筆：Demogame " + games.length + " 款、分析報告 " + analysis.length +
        " 份、其他報告 " + reports.length + " 份、常用連結 " + links.length + " 個";

    var box = document.getElementById("notes");
    if (!Omni.notes.length) { box.hidden = true; return; }
    box.hidden = false;
    box.innerHTML = Omni.notes.map(function (n) {
      return '<div>⚠ ' + Omni.esc(n) + '</div>';
    }).join("");
  }

  function setCount(id, n) {
    document.getElementById("n-" + id).textContent = n === null ? "" : n;
  }

  /* ---------- Demogame ---------- */
  function renderDemo(q) {
    var body = document.getElementById("demo-body");
    var list = games.filter(function (g) { return matches(g, q); });
    setCount("demo", loading.demo && !games.length ? null : list.length + " 款");

    viewBtn.textContent = demoView === "list" ? "▦ 卡片" : "☰ 清單";
    viewBtn.title = demoView === "list" ? "點一下切換成卡片" : "點一下切換成清單";

    if (loading.demo && !games.length) { body.className = ""; body.innerHTML = emptyBox("正在載入 Demogame…"); return; }
    if (!list.length) { body.className = ""; body.innerHTML = emptyBox(q ? "沒有符合的遊戲。" : "掃不到任何遊戲。"); return; }

    // NEW 緞帶：更新時間最新的前 3 款
    var newest = {};
    list.slice(0, 3).forEach(function (g) { if (g.updated) newest[g.folder] = true; });

    if (demoView === "list") {
      body.className = "grid";
      body.innerHTML = list.map(function (g) { return Omni.listCard(Omni.gameAsItem(g)); }).join("");
    } else {
      body.className = "rail";
      body.innerHTML = list.map(function (g) { return Omni.gameCard(g, !!newest[g.folder]); }).join("");
    }
  }

  viewBtn.addEventListener("click", function () {
    demoView = demoView === "list" ? "rail" : "list";
    try { localStorage.setItem(VIEW_KEY, demoView); } catch (e) {}
    renderDemo(qEl.value.trim().toLowerCase());
  });

  /* ---------- 卡片區（分析報告、其他報告） ---------- */
  function renderCards(id, items, q, unit, emptyMsg) {
    var body = document.getElementById(id + "-body");
    var list = items.filter(function (i) { return matches(i, q); });
    var busy = loading[id] && !items.length;
    setCount(id, busy ? null : list.length + " " + unit);
    if (busy) { body.innerHTML = emptyBox("正在載入…"); return; }
    if (!list.length) { body.innerHTML = emptyBox(q ? "沒有符合的項目。" : emptyMsg); return; }
    body.innerHTML = list.map(Omni.listCard).join("");
  }

  /* ---------- 常用連結（Cworld 爬山頁的連結列樣式） ---------- */
  function renderLinks(q) {
    var body = document.getElementById("links-body");
    var list = manualOf("links").filter(function (i) { return matches(i, q); });
    setCount("links", list.length + " 個");
    if (!list.length) {
      body.innerHTML = emptyBox(q ? "沒有符合的連結。"
        : "常用連結待補 — 在 catalog.js 加入 cat: \"links\" 的項目。");
      return;
    }
    body.innerHTML = list.map(function (l) {
      return '<a class="link-card" href="' + Omni.esc(l.url) + '" target="_blank" rel="noopener noreferrer"' +
             (l.desc ? ' title="' + Omni.esc(l.desc) + '"' : '') + '>' +
        (l.game ? '<span class="lk-tag">' + Omni.esc(l.game) + '</span>' : '') +
        '<span class="lk-name">' + Omni.esc(l.title) + '</span>' +
        '<span class="arrow">→</span>' +
      '</a>';
    }).join("");
  }

  function renderAll() {
    var q = qEl.value.trim().toLowerCase();
    renderTop();
    renderDemo(q);
    renderCards("analysis", analysis.slice().sort(byDateDesc), q, "份", "掃不到任何分析報告。");
    renderCards("report", manualOf("report"), q, "份",
      "還沒有其他報告 — 在 catalog.js 加入 cat: \"report\" 的項目。");
    renderLinks(q);
  }

  qEl.addEventListener("input", renderAll);
  renderAll();

  Omni.loadGames().then(function (g) { games = g; loading.demo = false; renderAll(); });
  Omni.loadAnalysis().then(function (a) { analysis = a; loading.analysis = false; renderAll(); });
})();
</script>
</body>
</html>
